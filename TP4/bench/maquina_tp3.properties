# Máquina de medición de TP3 y TP4 (D12). runtime_tp4.sh y control_tp3.sh comparan la máquina actual contra estos
# valores y abortan si alguno falta o no coincide (--allow-other-machine lo saltea, solo para pruebas en otra PC).
# hostname: salida de `hostname` · processor_identifier: $PROCESSOR_IDENTIFIER · java_version: java.vendor + " " +
# java.version (el meta.json de la tanda A de TP3 registra "Oracle Corporation 21.0.10"; no registra hostname ni CPU).
hostname=ASUS_Fede
processor_identifier=Intel64 Family 6 Model 142 Stepping 11, GenuineIntel
java_version=Oracle Corporation 21.0.10
